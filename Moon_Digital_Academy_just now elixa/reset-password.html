<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Moon Digital Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#14163A; --grey:#6B7280; --grey-light:#9CA3AF; --border:#E6E4F3;
  --violet:#5B3FD6; --violet-dark:#4A30B8;
  --gradient: linear-gradient(150deg,#15308E 0%, #2A2C9A 45%, #3E2C95 100%);
  --green:#3F8F62; --green-bg:#DDF2E3; --red:#D64545; --red-bg:#FBE3E3;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;color:var(--navy);background:#F5F3FC;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
h2{font-family:'Poppins',sans-serif;margin:0;}
p{margin:0;}
a{text-decoration:none;color:inherit;}
button{color:inherit;font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;}
input{font-family:'Inter',sans-serif;}

.card{width:100%;max-width:420px;background:#fff;border-radius:20px;box-shadow:0 30px 60px -30px rgba(20,22,58,.25);padding:40px 36px;}
.ic-circle{width:52px;height:52px;border-radius:14px;background:var(--gradient);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.ic-circle svg{width:24px;height:24px;color:#fff;}
h2{font-size:21px;margin-bottom:8px;}
.sub{font-size:13.5px;color:var(--grey);line-height:1.6;margin-bottom:24px;}
.sub b{color:var(--navy);}

.alert{display:none;align-items:flex-start;gap:9px;padding:12px 14px;border-radius:11px;font-size:12.5px;line-height:1.6;margin-bottom:18px;}
.alert.show{display:flex;}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}
.alert-error{background:var(--red-bg);color:var(--red);}
.alert-success{background:var(--green-bg);color:var(--green);}

.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-wrap svg.icon-left{position:absolute;left:13px;color:var(--grey-light);width:16px;height:16px;}
.input-wrap input{
  width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--border);border-radius:11px;
  font-size:13.5px;background:#fff;outline:none;transition:.15s;color:var(--navy);
}
.input-wrap input::placeholder{color:#B7B6CC;}
.input-wrap input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(91,63,214,.13);}
.input-wrap input.invalid{border-color:var(--red);}
.pw-toggle{position:absolute;right:12px;background:none;padding:2px;color:var(--grey-light);display:flex;}
.pw-toggle svg{width:16px;height:16px;}
.field-error{font-size:11.5px;color:var(--red);margin-top:6px;display:none;}
.field-error.show{display:block;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;padding:13px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s;}
.btn-violet{background:var(--violet);color:#fff;}
.btn-violet:hover{background:var(--violet-dark);}
.btn-violet:disabled{background:#B8ABEA;cursor:not-allowed;}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
.spinner.show{display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none;}
</style>
</head>
<body>
<div class="card">
  <div id="loadingState">
    <div class="ic-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg></div>
    <h2>Checking your link…</h2>
    <p class="sub">One moment while we verify your reset link.</p>
  </div>

  <div id="invalidState" class="hidden">
    <div class="ic-circle" style="background:var(--red);"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg></div>
    <h2>This link isn't valid</h2>
    <p class="sub" id="invalidMsg">This reset link has expired or has already been used.</p>
    <a href="forgot-password.html" class="btn btn-violet" style="text-decoration:none;">Request a new link</a>
  </div>

  <div id="formState" class="hidden">
    <div class="ic-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
    <h2>Set a new password</h2>
    <p class="sub">Resetting password for <b id="userEmail"></b></p>

    <div class="alert alert-error" id="errorAlert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
      <span id="errorText"></span>
    </div>
    <div class="alert alert-success" id="successAlert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
      <span id="successText"></span>
    </div>

    <form id="resetForm" novalidate>
      <div class="field">
        <label>New Password</label>
        <div class="input-wrap">
          <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" placeholder="Enter new password" id="pw1" required>
          <button class="pw-toggle" id="pwToggle1" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <div class="field-error" id="pw1Error">Password must be at least 6 characters.</div>
      </div>
      <div class="field">
        <label>Confirm New Password</label>
        <div class="input-wrap">
          <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          <input type="password" placeholder="Re-enter new password" id="pw2" required>
        </div>
        <div class="field-error" id="pw2Error">Passwords don't match.</div>
      </div>
      <button type="submit" class="btn btn-violet" id="resetBtn">
        <span class="spinner" id="resetSpinner"></span>
        <span id="resetLabel">Reset Password</span>
      </button>
    </form>
  </div>
</div>

<script type="module">
  import { verifyResetCode, confirmReset, friendlyAuthError } from './auth.js';

  const params = new URLSearchParams(window.location.search);
  const oobCode = params.get('oobCode');

  const loadingState = document.getElementById('loadingState');
  const invalidState = document.getElementById('invalidState');
  const formState = document.getElementById('formState');
  const invalidMsg = document.getElementById('invalidMsg');
  const userEmail = document.getElementById('userEmail');

  function show(el){
    [loadingState, invalidState, formState].forEach(s => s.classList.add('hidden'));
    el.classList.remove('hidden');
  }

  (async function init(){
    if(!oobCode){
      invalidMsg.textContent = 'This reset link is missing required information.';
      show(invalidState);
      return;
    }
    try{
      const email = await verifyResetCode(oobCode);
      userEmail.textContent = email;
      show(formState);
    }catch(err){
      invalidMsg.textContent = friendlyAuthError(err.code);
      show(invalidState);
    }
  })();

  const pw1 = document.getElementById('pw1');
  const pw2 = document.getElementById('pw2');
  document.getElementById('pwToggle1').addEventListener('click', function(){
    pw1.type = pw1.type === 'password' ? 'text' : 'password';
  });

  const resetForm = document.getElementById('resetForm');
  const resetBtn = document.getElementById('resetBtn');
  const resetSpinner = document.getElementById('resetSpinner');
  const resetLabel = document.getElementById('resetLabel');
  const errorAlert = document.getElementById('errorAlert');
  const errorText = document.getElementById('errorText');
  const successAlert = document.getElementById('successAlert');
  const successText = document.getElementById('successText');

  function showError(msg){
    errorText.textContent = msg;
    errorAlert.classList.add('show');
    successAlert.classList.remove('show');
  }
  function showSuccess(msg){
    successText.textContent = msg;
    successAlert.classList.add('show');
    errorAlert.classList.remove('show');
  }
  function setLoading(loading){
    resetBtn.disabled = loading;
    resetSpinner.classList.toggle('show', loading);
    resetLabel.textContent = loading ? 'Saving…' : 'Reset Password';
  }

  resetForm.addEventListener('submit', async function(e){
    e.preventDefault();
    let ok = true;
    const pw1Ok = pw1.value.length >= 6;
    document.getElementById('pw1Error').classList.toggle('show', !pw1Ok);
    pw1.classList.toggle('invalid', !pw1Ok);
    if(!pw1Ok) ok = false;

    const matchOk = pw1.value === pw2.value && pw2.value.length > 0;
    document.getElementById('pw2Error').classList.toggle('show', !matchOk);
    pw2.classList.toggle('invalid', !matchOk);
    if(!matchOk) ok = false;

    if(!ok) return;

    setLoading(true);
    try{
      await confirmReset(oobCode, pw1.value);
      showSuccess('Your password has been reset. Redirecting to log in…');
      setTimeout(() => window.location.href = 'login.html', 1500);
    }catch(err){
      showError(friendlyAuthError(err.code));
      setLoading(false);
    }
  });
</script>
</body>
</html>
