<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — Moon Digital Academy</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --navy:#14163A; --grey:#6B7280; --grey-light:#9CA3AF; --border:#E6E4F3;
  --violet:#5B3FD6; --violet-dark:#4A30B8;
  --gradient: linear-gradient(150deg,#15308E 0%, #2A2C9A 45%, #3E2C95 100%);
  --green:#3F8F62; --green-bg:#DDF2E3; --red:#D64545; --red-bg:#FBE3E3;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;color:var(--navy);background:#F5F3FC;-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
h2{font-family:'Poppins',sans-serif;margin:0;}
p{margin:0;}
a{text-decoration:none;color:inherit;}
button{color:inherit;font-family:'Inter',sans-serif;cursor:pointer;border:none;background:none;}
input{font-family:'Inter',sans-serif;}

.card{width:100%;max-width:420px;background:#fff;border-radius:20px;box-shadow:0 30px 60px -30px rgba(20,22,58,.25);padding:40px 36px;}
.ic-circle{width:52px;height:52px;border-radius:14px;background:var(--gradient);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
.ic-circle svg{width:24px;height:24px;color:#fff;}
h2{font-size:21px;margin-bottom:8px;}
.sub{font-size:13.5px;color:var(--grey);line-height:1.6;margin-bottom:24px;}

.alert{display:none;align-items:flex-start;gap:9px;padding:12px 14px;border-radius:11px;font-size:12.5px;line-height:1.6;margin-bottom:18px;}
.alert.show{display:flex;}
.alert svg{width:16px;height:16px;flex-shrink:0;margin-top:1px;}
.alert-error{background:var(--red-bg);color:var(--red);}
.alert-success{background:var(--green-bg);color:var(--green);}

.field{margin-bottom:18px;}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;}
.input-wrap{position:relative;display:flex;align-items:center;}
.input-wrap svg.icon-left{position:absolute;left:13px;color:var(--grey-light);width:16px;height:16px;}
.input-wrap input{
  width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--border);border-radius:11px;
  font-size:13.5px;background:#fff;outline:none;transition:.15s;color:var(--navy);
}
.input-wrap input::placeholder{color:#B7B6CC;}
.input-wrap input:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(91,63,214,.13);}
.input-wrap input.invalid{border-color:var(--red);}
.field-error{font-size:11.5px;color:var(--red);margin-top:6px;display:none;}
.field-error.show{display:block;}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;padding:13px;border-radius:12px;font-weight:600;font-size:14px;transition:.15s;}
.btn-violet{background:var(--violet);color:#fff;}
.btn-violet:hover{background:var(--violet-dark);}
.btn-violet:disabled{background:#B8ABEA;cursor:not-allowed;}
.spinner{width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;}
.spinner.show{display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}

.back-row{margin-top:22px;text-align:center;font-size:12.5px;color:var(--grey);}
.back-row a{color:var(--violet);font-weight:700;}
</style>
</head>
<body>
<div class="card">
  <div class="ic-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
  <h2>Forgot your password?</h2>
  <p class="sub">Enter the email address linked to your account and we'll send you a link to reset your password.</p>

  <div class="alert alert-error" id="errorAlert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
    <span id="errorText"></span>
  </div>
  <div class="alert alert-success" id="successAlert">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
    <span id="successText"></span>
  </div>

  <form id="resetForm" novalidate>
    <div class="field">
      <label>Email Address</label>
      <div class="input-wrap">
        <svg class="icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M4 7l8 6 8-6"/></svg>
        <input type="email" placeholder="Enter your email" id="email" required>
      </div>
      <div class="field-error" id="emailError">Please enter a valid email address.</div>
    </div>
    <button type="submit" class="btn btn-violet" id="sendBtn">
      <span class="spinner" id="sendSpinner"></span>
      <span id="sendLabel">Send Reset Link</span>
    </button>
  </form>

  <div class="back-row">Remembered it? <a href="login.html">Back to log in</a></div>
</div>

<script type="module">
  import { requestPasswordReset, friendlyAuthError } from './auth.js';

  const form = document.getElementById('resetForm');
  const email = document.getElementById('email');
  const sendBtn = document.getElementById('sendBtn');
  const sendSpinner = document.getElementById('sendSpinner');
  const sendLabel = document.getElementById('sendLabel');
  const errorAlert = document.getElementById('errorAlert');
  const errorText = document.getElementById('errorText');
  const successAlert = document.getElementById('successAlert');
  const successText = document.getElementById('successText');

  function showError(msg){
    errorText.textContent = msg;
    errorAlert.classList.add('show');
    successAlert.classList.remove('show');
  }
  function showSuccess(msg){
    successText.textContent = msg;
    successAlert.classList.add('show');
    errorAlert.classList.remove('show');
  }
  function setLoading(loading){
    sendBtn.disabled = loading;
    sendSpinner.classList.toggle('show', loading);
    sendLabel.textContent = loading ? 'Sending…' : 'Send Reset Link';
  }

  form.addEventListener('submit', async function(e){
    e.preventDefault();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim());
    document.getElementById('emailError').classList.toggle('show', !valid);
    email.classList.toggle('invalid', !valid);
    if(!valid) return;

    setLoading(true);
    try{
      await requestPasswordReset(email.value.trim());
      showSuccess('If an account exists for that email, a reset link is on its way. Check your inbox (and spam folder).');
      form.reset();
    }catch(err){
      // Note: for privacy you may prefer to always show the success message
      // regardless of whether the account exists. Shown here for clarity during dev.
      showError(friendlyAuthError(err.code));
    }finally{
      setLoading(false);
    }
  });
</script>
</body>
</html>
